name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace
      - run: cargo test -p hft-spsc --features loom loom_
      - run: cargo test -p hft-bench
      - run: cargo test -p hft-soak
      - run: cargo test -p hft-wire malformed_input_smoke_never_panics
      - run: cargo run --release -p hft-soak -- --profile smoke
      - run: cargo run --release -p hft-bench
      - run: python scripts/source_ratio.py
      - name: Reject unexpected unsafe code
        run: |
          found=$(grep -R -n --include='*.rs' -E 'unsafe[[:space:]]*(\{|impl|fn|extern)|UnsafeCell|static[[:space:]]+mut' crates | cut -d: -f1 | sort -u || true)
          allowed=$'crates/hft-bench/src/main.rs\ncrates/hft-ffi/src/lib.rs\ncrates/hft-ffi/tests/native_abi.rs\ncrates/hft-spsc/src/lib.rs'
          test "$found" = "$allowed"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 check --locked --workspace --all-targets
      - run: cargo +1.85.0 test --locked --workspace

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p hft-wire -p hft-risk -p hft-book -p hft-spsc

  ffi-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: ASan on the native boundary
        env:
          CC: clang
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p hft-ffi --features vendor-sdk
      - name: UBSan on the native boundary
        env:
          CC: clang
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
          RUSTFLAGS: -C linker=clang -C link-args=-fsanitize=undefined
        run: cargo +nightly test -p hft-ffi --features vendor-sdk
