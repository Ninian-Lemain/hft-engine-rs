[workspace]
resolver = "2"
members = [
    "crates/hft-types",
    "crates/hft-wire",
    "crates/hft-io",
    "crates/hft-spsc",
    "crates/hft-risk",
    "crates/hft-book",
    "crates/hft-model",
    "crates/hft-gateway",
    "crates/hft-events",
    "crates/hft-router",
    "crates/hft-ffi",
    "crates/hft-replay",
    "crates/hft-session",
    "crates/hft-journal",
    "crates/hft-recovery",
    "crates/hft-soak",
    "crates/hft-bench",
    "crates/hft-cli",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ninian-Lemain/deterministic-exchange-rs"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("loom"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
